# API configuration of the JSON API (SP013, BD-08, BD-09). Tcl syntax, evaluated in a safe
# interpreter: only "array set API_CONFIG {...}" is meaningful.
#
# The defaults preserve the v1 behaviour of the classic UI (NFR-045): every flag is false.
#   strict_mode        true: Content-Type application/json and X-Requested-With are required (v1 path)
#   config_tool_mode   true: CfgTool deployment (no privilege check, tclrega.so not loaded)
#   v2_enabled         true: /api/v2 routes are served
#   cookie_mode        true: /api/v2 also reads and sets the hm_sid cookie
#   rate_limit         true: per-sid (60/10 s) and per-IP login (10/60 s) limits on the v1 path
#   sid_shape_strict   true: session ids must have the shape ^@?[A-Za-z0-9]{10}@?$ (EG-8)
# Optional keys: path_allow_list.<CCU.createFile|CCU.existsFile|backup_files>,
# path_allow_pattern.CCU.existsFile, download_timeout_seconds, event_lock_stale_seconds
#   path_allow_list.CCU.createFile    default: /etc/config/userAckSecurityHint,
#       /etc/config/firewallConfigured, /etc/config/fieldTestActive,
#       /etc/config/legacyAPIMigrationAccepted (exact match)
#   path_allow_list.CCU.existsFile    default: the four paths above plus
#       /etc/config/showDiagramDatapoints and /media/sd-mmcblk0/measurement (exact match)
#   path_allow_pattern.CCU.existsFile default: the two anchored expressions (regexp on the whole
#       request string, no normalisation, existsFile only, never createFile)
#         ^/etc/config/userprofiles/userAckInstallWizardId_[0-9]{1,10}$
#         ^/etc/config/userprofiles/userAckInstallWizard_[^/\x00]{1,200}$
array set API_CONFIG {
  strict_mode false
  config_tool_mode false
  v2_enabled false
  cookie_mode false
  rate_limit false
  sid_shape_strict false
  batch_limit 20
  per_sid_limit 60
  per_sid_window_seconds 10
  login_ip_limit 10
  login_ip_window_seconds 60
}
